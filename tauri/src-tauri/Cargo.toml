[package]
name = "zipquantum-tauri-example"
version = "0.1.0"
description = "Auditable Tauri 2 example for ZipQuantum mobile-v1"
authors = ["ZipQuantum"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "zipquantum_tauri_example"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
tauri = { version = "2.9.5", features = [] }
tauri-plugin-deep-link = "2.4.10"
tauri-plugin-os = "2.3.2"
tauri-plugin-zq-deferred = { path = "../plugins/deferred-link" }

[target.'cfg(desktop)'.dependencies]
tauri-plugin-single-instance = { version = "2.4.4", features = ["deep-link"] }
