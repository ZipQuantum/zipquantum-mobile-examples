name: Validate examples

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: chmod +x scripts/validate.sh && scripts/validate.sh

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-kotlin
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - run: gradle test lint --stacktrace

  react-native:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-native
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: react-native/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios-swiftui
    steps:
      - uses: actions/checkout@v5
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: xcodebuild -project ZipQuantumExample.xcodeproj -scheme ZipQuantumExample -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
